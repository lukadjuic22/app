*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:Roboto,system-ui,-apple-system,sans-serif;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
body.lk{overflow:hidden}button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
svg{display:block}
.hd{position:sticky;top:0;z-index:5;padding-top:env(safe-area-inset-top,0px);background:var(--h,var(--bg))}.hd.hl{--h:var(--hl)}
.hr{position:relative;height:56px;display:flex;align-items:center;padding:0 12px;color:var(--teal)}
.ti{position:absolute;left:70px;right:70px;text-align:center;font-size:20px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
.hr .sp{flex:1}.ib{width:40px;height:40px;display:grid;place-items:center;color:var(--teal)}
.yr{display:flex;justify-content:space-between;padding:6px 15px;font-size:15px;color:var(--teal);letter-spacing:.3px}
.nd{text-align:center;font-size:20px;margin:22px 0 0;letter-spacing:.4px}.dbi{display:block;width:150px;margin:120px auto 0}
.pg{padding-bottom:calc(40px + env(safe-area-inset-bottom,0px))}.pg.bp{padding-bottom:calc(100px + env(safe-area-inset-bottom,0px))}
.pr{display:flex;align-items:center;gap:20px;padding:6px 15px 10px}.pr img{width:100px;height:100px;border-radius:50%}.pr div{font-size:18px;line-height:1.35;font-weight:300;letter-spacing:.5px}
.ev{margin:4px 20px 14px;height:58px;border:1px solid var(--ln);background:var(--card);border-radius:4px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;font-size:16px;letter-spacing:.4px;color:#d8d8d8}
.h2{text-align:center;font-size:21px;font-weight:500;margin:16px 10px 0;color:#d2d2d2}
.g{display:block;width:100%;max-width:414px;margin:0 auto}.gt{fill:#bdbdbd;font-size:14px;text-anchor:middle;dominant-baseline:middle}.gn{fill:#d8d8d8;font-size:48px;font-weight:700;text-anchor:middle}.gc{fill:#cfcfcf;font-size:12px;letter-spacing:2px;text-anchor:middle}
.lg{display:flex;justify-content:center;gap:16px;font-size:16px;margin:6px 0 16px}.lg i{display:inline-block;width:20px;height:10px;margin-right:4px}
.tl{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 19px}.t{position:relative;height:184px;background:var(--card);border-radius:16px;padding:12px 10px;box-shadow:0 5px 12px rgba(0,0,0,.28)}
.t b{font-size:15px;font-weight:700;color:#dcdcdc;line-height:1.2;display:block;letter-spacing:.3px}.t em{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);text-align:center;font-style:normal;font-size:50px;font-weight:700}.t small{position:absolute;left:10px;bottom:14px;font-size:14px;letter-spacing:.6px;color:#c9c9c9}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;height:calc(64px + env(safe-area-inset-bottom,0px));padding-bottom:env(safe-area-inset-bottom,0px);background:#3d3d3d;border-top:1px solid #565656}
.tb{flex:1;position:relative;display:flex;align-items:center;justify-content:center;color:var(--ic)}
.tb.s .ci{position:absolute;top:-28px;width:52px;height:52px;border-radius:50%;background:var(--teal);color:#fff;display:grid;place-items:center;box-shadow:0 0 0 5px #3d3d3d,0 0 0 6px #565656}
.tb .lb{display:none}.tb.s .lb{display:block;position:absolute;top:30px;font-size:11px;letter-spacing:1.5px;text-align:center;line-height:1.35;color:#d4d4d4;white-space:nowrap}.tb.s>svg{visibility:hidden}
.gh{text-align:center;font-size:17px;margin:12px 0 9px;color:#d6d6d6}
.rw{display:flex;align-items:center;gap:15px;padding:9px 4px 9px 15px;min-height:56px;background:#424242;border:1px solid #4e4e4e;border-width:1px 0}
.cr{flex:none;width:50px;height:50px;border-radius:50%;display:grid;place-items:center;font-size:17px;font-weight:500;color:#101010}.rw .cr.dt{width:28px;height:28px;margin-left:6px}
.rt{flex:1;min-width:0}.l1,.l2{display:flex;justify-content:space-between;gap:10px;align-items:flex-end}.l1 b{font-weight:400;font-size:17px;line-height:1.2;letter-spacing:.3px;color:#d6d6d6}.l1 span{flex:none;font-size:17px;letter-spacing:.3px;color:#d6d6d6;padding-right:4px}
.rt>b{font-weight:400;font-size:17px;line-height:1.2;color:#d6d6d6;display:block;letter-spacing:.3px}.l2 small{font-size:14px;color:#c4c4c4;letter-spacing:.6px;padding:3px 4px 0 0}
.ar{flex:none;color:#eee;margin-right:-2px}.wi{display:flex;gap:4px;padding-right:6px}
.inf{padding:6px 15px 0;font-size:18px;line-height:1.3;color:#dcdcdc;letter-spacing:.3px}
.bn{width:100%;height:150px;object-fit:cover;display:block}.sy{font-size:19px;padding:11px 15px 10px;border-bottom:1px solid #565656;letter-spacing:.3px;color:#d8d8d8}.dl{padding:12px 15px}.dl p{margin:0 0 8px;font-size:18px;line-height:1.2;letter-spacing:.3px;color:#d4d4d4}
.nt{margin:8px 9px 0;background:#1d1b20;border-radius:16px;padding:14px 16px;display:flex;gap:16px;align-items:center;font-size:13.5px;line-height:1.3;color:#c9c9c9;letter-spacing:.3px;box-shadow:0 4px 10px rgba(0,0,0,.3)}
.ph{display:flex;align-items:center;gap:14px;margin:28px 15px 14px;color:var(--teal);font-size:19px;letter-spacing:.3px}.ph svg{color:#eee}
.fl{margin:0 15px}.fl label{display:block;font-size:17px;color:#d4d4d4;margin:0 0 5px;letter-spacing:.3px}.fl div{height:30px;border:1px solid #7b7b7b;border-radius:4px;padding:0 16px;margin-bottom:8px;display:flex;align-items:center;font-size:17px;letter-spacing:.4px;color:#dcdcdc;box-sizing:content-box;min-height:30px}
.kv{display:grid;grid-template-columns:151px 100px;padding:4px 15px 0;font-size:18px;line-height:1.5;color:#dcdcdc;letter-spacing:.3px}.kv span:nth-child(even){text-align:right}.ct{text-align:center;font-size:18px;color:#dcdcdc;letter-spacing:.4px;margin:12px 0}
.sc{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.55);opacity:0;visibility:hidden;transition:opacity .2s,visibility 0s .2s}.sc.o{opacity:1;visibility:visible;transition:opacity .2s}
.dr{position:fixed;z-index:21;left:0;top:env(safe-area-inset-top,0px);bottom:env(safe-area-inset-bottom,0px);width:300px;max-width:84%;overflow-y:auto;background:var(--bg);transform:translateX(-102%);visibility:hidden;transition:transform .22s ease,visibility 0s .22s;color:var(--teal);box-shadow:4px 0 16px rgba(0,0,0,.4)}.dr.o{transform:none;visibility:visible;transition:transform .22s ease}
.dh{height:91px;display:flex;align-items:center;justify-content:space-between;padding:0 16px 0 10px;background:var(--hl);font-size:20px;font-weight:300;letter-spacing:.5px;border-bottom:1px solid #565656}.dh img{height:35px}.dp{display:flex;align-items:center;gap:18px;padding:30px 16px 22px;color:#dcdcdc;font-size:18px;line-height:1.4;font-weight:300;letter-spacing:.5px}.dp img{width:100px;height:100px;border-radius:50%}
.mi{display:flex;align-items:center;gap:18px;width:100%;height:46px;padding:0 20px;font-size:18px;letter-spacing:.6px;text-align:left}.mi svg{flex:none}.dv{height:1px;background:#8b8b8b;margin:8px 0}.cp{padding:26px 16px 22px;font-size:14px;line-height:1.35;letter-spacing:.6px}
</style></head><body>
<div id="app"></div><div class="sc" id="sc"></div><div class="dr" id="dr"></div>
